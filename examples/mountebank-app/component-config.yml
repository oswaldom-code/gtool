version: v1

# The application under test: built from the Dockerfile in this directory.
app-technology: golang
app-config:
  docker-image: mountebank-app:latest
  port: 8080
  environment:
    # The app container reaches the host-published imposter through the host
    # gateway that gtool maps to host.docker.internal.
    GREETING_API_URL: http://host.docker.internal:4545

# Backend API tests (Karate).
test-launcher: test-launcher-back
test-config:
  features-path: ./test/component/features
  reports-path: ./test/component/reports
  tags: smoke

# Mock dependencies started by gtool.
third-party:
  mocks:
    - mountebank
  mock-config:
    mountebank:
      port: "2525"
      imposters-path: ./test/component/mocks-data/mountebank
