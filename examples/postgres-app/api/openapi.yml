openapi: 3.0.3
info:
  title: postgres-app
  version: "1.0"
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      tags: [ops]
      responses:
        "200": { description: Database reachable }
        "503": { description: Database unreachable }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
            example: { name: Grace Hopper }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Invalid body }
components:
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
