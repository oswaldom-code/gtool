version: v1

# The application under test: built from the Dockerfile in this directory.
app-technology: golang
app-config:
  docker-image: s3-app:latest
  port: 8080
  environment:
    # The app container reaches the host-published Floci through the host
    # gateway that gtool maps to host.docker.internal.
    S3_ENDPOINT: http://host.docker.internal:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test

# Backend API tests (Karate).
test-launcher: test-launcher-back
test-config:
  features-path: ./test/component/features
  reports-path: ./test/component/reports
  tags: smoke

# Mock dependencies started by gtool.
third-party:
  mocks:
    - floci
  mock-config:
    floci:
      port: "4566"
      buckets:
        - reports
