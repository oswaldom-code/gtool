# GTOOL Configuration File
# This file configures the component testing pipeline
# Documentation: https://github.com/oswaldom-code/gtool

# ═══════════════════════════════════════════════════════════
# VERSION
# ═══════════════════════════════════════════════════════════
version: v1

# ═══════════════════════════════════════════════════════════
# APPLICATION CONFIGURATION
# ═══════════════════════════════════════════════════════════
# Technology: golang, generic
app-technology: golang

app-config:
  # Docker image of the application under test (build it before gtool test)
  docker-image: myapp:latest

  # Port the application listens on inside the container
  port: 8080

  # Host port the container is published on: auto picks a free port per run,
  # so several runs can share one host. Omit it to publish on the same port.
  host-port: auto

  # Environment variables for the application. ${mocks.<service>.<key>} and
  # ${app.port} / ${app.host-port} are replaced with this run's values.
  environment:
    LOG_LEVEL: debug
    DB_HOST: host.docker.internal
    DB_PORT: "${mocks.postgresql.port}"

# ═══════════════════════════════════════════════════════════
# TEST CONFIGURATION
# ═══════════════════════════════════════════════════════════
# Test launcher: test-launcher-back (Karate)
test-launcher: test-launcher-back

test-config:
  # Test tags to run (e.g., "@smoke", "@integration")
  tags: "@integration"

  # Path to feature files; features reach the app through appUrl
  features-path: ./test/component/features

  # Path for test reports
  reports-path: ./test/component/reports

# ═══════════════════════════════════════════════════════════
# THIRD-PARTY SERVICES (MOCKS)
# ═══════════════════════════════════════════════════════════
third-party:
  # List of services to start
  # Available: postgresql, mysql, mongodb, redis, couchbase, kafka, pubsub,
  #            gcs, floci, mountebank
  mocks:
    - postgresql
    # - mountebank
    # - kafka

  # Configuration for each service. Any port key (port, *-port) accepts auto.
  mock-config:
    postgresql:
      image: postgres:16-alpine
      port: auto
      user: postgres
      password: postgres
      database: postgres
      # Path to SQL initialization scripts
      scripts-path: ./test/component/mocks-data/postgresql

    # mountebank:
    #   port: auto
    #   imposters-path: ./test/component/mocks-data/mountebank

    # couchbase:
    #   image: couchbase:community-7.6.2
    #   bucket: test-bucket
    #   username: Administrator
    #   password: password

    # kafka:
    #   image: apache/kafka:3.7.0
    #   port: auto
    #   # Port the app container uses (host.docker.internal:<docker-port>)
    #   docker-port: auto
    #   topics:
    #     - test-topic
    #     - events-topic

# ═══════════════════════════════════════════════════════════
# ORCHESTRATION SETTINGS
# ═══════════════════════════════════════════════════════════
orchestration:
  # Start mocks in parallel (faster) or sequential (safer)
  parallel-mocks: true

  # Maximum time to wait for services to start
  startup-timeout: 180s

  # Interval between health checks
  health-check-interval: 3s

  # Maximum number of health check retries
  health-check-retries: 60

  # Clean up services if startup fails
  cleanup-on-failure: true

# ═══════════════════════════════════════════════════════════
# OBSERVABILITY
# ═══════════════════════════════════════════════════════════
observability:
  # Log level: debug, info, warn, error (overridden by --log-level)
  log-level: info
